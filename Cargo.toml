[package]
name = "wsarb"
version = "0.1.0"
edition = "2021"
description = "Websocket arbitration proxy for multiple Hyperliquid sources"

# Stand alone rather than let cargo walk up looking for a parent workspace: the
# build has already died on an unrelated stray Cargo.toml sitting in the deploy
# directory's parent.
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
# TLS, so the load test can reach wsarb through nginx over wss:// rather than
# only on the loopback port. Needs libssl-dev and pkg-config on the build host.
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
